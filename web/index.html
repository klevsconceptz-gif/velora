<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Velora · creator memberships, paid in crypto</title>
  <meta name="description" content="Velora is a creator membership platform: support creators you value with 30-day memberships paid in on-chain crypto and Tether, with privacy-respecting defaults and no automatic renewal.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0e1a">
  <meta name="referrer" content="same-origin">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0e1a'/%3E%3Cpath d='M18 16l14 34 14-34' fill='none' stroke='%236b7bf6' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <a class="skip-link" href="#app">Skip to main content</a>

  <p class="session-banner" id="session-banner" role="status" hidden></p>

  <header class="site-header">
    <div class="shell site-header__inner" id="site-header-inner">
      <span class="brand">
        <span class="brand__mark" aria-hidden="true">V</span>
        <span>
          <span>Velora</span>
          <span class="brand__tag">creator memberships</span>
        </span>
      </span>
    </div>
  </header>

  <main id="app" tabindex="-1" class="shell main-region">
    <div class="loading-block" role="status">
      <span class="skeleton skeleton--line"></span>
      <span class="skeleton skeleton--line"></span>
      <span class="skeleton skeleton--line skeleton--short"></span>
      <p class="subtle">Loading Velora…</p>
    </div>
  </main>

  <footer class="site-footer" id="site-footer">
    <div class="shell">
      <p class="subtle">
        Velora stores only what a membership platform needs. Memberships are one-time 30-day
        purchases paid in on-chain crypto or Tether — nothing renews automatically.
      </p>
    </div>
  </footer>

  <noscript>
    <div class="shell">
      <h1>Velora needs JavaScript</h1>
      <p>
        This app is a small, dependency-free single-page application served by Velora itself.
        Please enable JavaScript to browse creators, create an account or sign in.
      </p>
      <p>
        <a href="/privacy">Privacy summary</a> ·
        <a href="/#/discover">Discover creators</a> ·
        <a href="/#/signup">Create an account</a>
      </p>
    </div>
  </noscript>

  <script type="module" src="assets/app.js"></script>
</body>
</html>
